name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm test
      - run: npm run permissions

  package:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Built twice: the archive is only useful as evidence if two builds agree.
      - run: npm run package && mv build/*.zip /tmp/first.zip
      - run: npm run package
      - run: |
          a=$(sha256sum /tmp/first.zip | cut -d' ' -f1)
          b=$(sha256sum build/*.zip | cut -d' ' -f1)
          echo "$a"
          test "$a" = "$b" || { echo "archive is not reproducible"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: build/*.zip
