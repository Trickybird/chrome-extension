name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run types
      - run: npm test
      - run: npm run permissions

  package:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Built twice: the archive is only useful as evidence if two builds agree.
      - run: npm run package && mv build/*.zip /tmp/first.zip
      - run: npm run package
      - run: |
          a=$(sha256sum /tmp/first.zip | cut -d' ' -f1)
          b=$(sha256sum build/*.zip | cut -d' ' -f1)
          echo "$a"
          test "$a" = "$b" || { echo "archive is not reproducible"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension
          path: build/*.zip
