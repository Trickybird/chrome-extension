<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TrickyBird</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- The mark is a single path, so it is inlined rather than fetched. brand.test.mjs pins this
       copy to the one on the options page. -->
  <div class="brand">
    <span class="brand-chip">
      <svg class="mark" viewBox="6.5 3 22 22" fill="currentColor" fill-rule="evenodd" aria-hidden="true">
        <path d="M21 5.5c-3.6 0-6.6 2.7-7 6.2-1 .4-2.6 1.3-3.6 2.3-1.8 1.8-2.4 4.6-2.4 4.6l3.3-1.3c-.4 1.6-.3 3 .3 4.5 0 0 1.3-2.4 2.4-3.2 1.1.7 2.5 1.1 3.9 1.1 3.9 0 7-3.1 7-7 0-1-.2-2-.6-2.8l2.7-1.7-3.1-.2c-1.3-1.6-3.2-2.6-5.4-2.6zm1 3.85a1.65 1.65 0 110 3.3a1.65 1.65 0 010-3.3"/>
      </svg>
    </span>
    <span class="wordmark">TrickyBird</span>
    <span class="strip-actions">
      <a class="icon-button" id="home" target="_blank" rel="noreferrer">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8.6 3.2H12.8V7.4" />
          <path d="M12.8 3.2 7.6 8.4" />
          <path d="M12 9.6V12.4a.9.9 0 0 1-.9.9H3.6a.9.9 0 0 1-.9-.9V4.9a.9.9 0 0 1 .9-.9H6.4" />
        </svg>
      </a>
      <button class="icon-button" id="manage" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="8" cy="8" r="4.3" stroke-width="1.6" />
          <path stroke-width="2.4" d="M12.6 8L14.1 8M11.25 11.25L12.31 12.31M8 12.6L8 14.1
                   M4.75 11.25L3.69 12.31M3.4 8L1.9 8M4.75 4.75L3.69 3.69M8 3.4L8 1.9M11.25 4.75L12.31 3.69" />
        </svg>
      </button>
    </span>
  </div>

  <!-- Three bands: what is happening, the explanation, and what you can do about it. Only the
       middle one moves, so the state and the action are never a scroll away from each other. -->
  <main id="panel">
    <header>
      <h1 id="heading" tabindex="-1" aria-live="polite"></h1>

      <!-- The browser's address bar, which is the whole state: what it reads is what changed.
           brand.test.mjs pins this copy of the mark to the others. -->
      <div class="route" id="status" role="img" hidden>
        <div class="dust"></div>
        <div class="art">
          <svg class="rt" viewBox="0 0 348 42" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs>
              <!-- A hostname wider than the field fades out instead of hard-cutting at the edge. -->
              <linearGradient id="rtFade" gradientUnits="userSpaceOnUse" x1="310" y1="0" x2="338" y2="0">
                <stop offset="0" stop-color="#fff"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <mask id="rtElide" maskUnits="userSpaceOnUse" x="0" y="0" width="348" height="42">
                <rect x="0" y="0" width="348" height="42" fill="url(#rtFade)"/>
              </mask>
              <clipPath id="rtTrack"><rect x="12" y="36" width="324" height="2" rx="1"/></clipPath>
            </defs>

            <rect class="rt-bar" x="0" y="1" width="348" height="40" rx="20"/>
            <rect class="rt-wash" x="0" y="1" width="348" height="40" rx="20"/>
            <rect class="rt-track" x="12" y="36" width="324" height="2" rx="1"/>
            <g clip-path="url(#rtTrack)">
              <rect class="rt-load" x="12" y="36" width="324" height="2" rx="1"/>
            </g>

            <!-- The site-information button, the round plate a browser keeps at the head of the
                 field. Fill only: the outlined square this replaced read as a control. -->
            <circle class="rt-plate" cx="20" cy="21" r="13"/>

            <!-- What the browser itself puts left of an address, so the object reads as an address
                 bar. Not a padlock: that would draw a security claim we do not make. -->
            <g class="rt-lead" transform="translate(20 21)"
               fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M-6 -3.6H6M-6 3.6H6"/>
              <!-- Rings, not dots: a filled handle at this size is a blob on a rail. -->
              <circle cx="-1.8" cy="-3.6" r="2.15"/>
              <circle cx="2.2" cy="3.6" r="2.15"/>
            </g>

            <!-- The address is the state: the site while the tab goes there itself, ours once
                 it does not. The baseline centres the ink rather than the capitals, because a
                 hostname nearly always carries a descender and that hangs the line low. Recompute it
                 whenever the size or the field height changes; the two are tied. -->
            <g mask="url(#rtElide)">
              <text class="rt-addr" id="artAddress" x="44" y="25.25"></text>

              <g id="artBrand" class="rt-brand">
                <!-- Ink measured, not guessed, and centred in the plate rather than aligned to the
                     glyph's left edge: a round slot centres whatever it holds. -->
                <g transform="translate(4.43 8.87) scale(0.89)">
                  <path class="mark-path" fill="currentColor" fill-rule="evenodd"
                        d="M21 5.5c-3.6 0-6.6 2.7-7 6.2-1 .4-2.6 1.3-3.6 2.3-1.8 1.8-2.4 4.6-2.4 4.6l3.3-1.3c-.4 1.6-.3 3 .3 4.5 0 0 1.3-2.4 2.4-3.2 1.1.7 2.5 1.1 3.9 1.1 3.9 0 7-3.1 7-7 0-1-.2-2-.6-2.8l2.7-1.7-3.1-.2c-1.3-1.6-3.2-2.6-5.4-2.6zm1 3.85a1.65 1.65 0 110 3.3a1.65 1.65 0 010-3.3"/>
                </g>
                <text x="44" y="25.25">TrickyBird</text>
              </g>
            </g>
          </svg>
        </div>
      </div>
    </header>

    <div id="scroll">
      <p id="body" aria-live="polite"></p>

      <details id="trade" class="trade" hidden>
        <summary id="tradeHeading"></summary>
        <ul>
          <li id="tradeServers"></li>
          <li id="tradeAddress"></li>
          <li id="tradeCookies"></li>
          <li id="tradeRequest"></li>
        </ul>
      </details>

      <p class="helper error" id="failure" role="alert" hidden></p>
    </div>

    <div class="actions">
      <button class="primary" id="primary" hidden></button>
      <button class="ghost" id="secondary" hidden></button>
      <p class="helper" id="helper" role="status"></p>
    </div>
  </main>

  <footer>
    <a class="footer-link" id="support" target="_blank" rel="noreferrer"></a>
    <a class="footer-link" id="terms" target="_blank" rel="noreferrer"></a>
    <a class="footer-link" id="privacy" target="_blank" rel="noreferrer"></a>
    <a class="footer-link" id="statusLink" target="_blank" rel="noreferrer"></a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
